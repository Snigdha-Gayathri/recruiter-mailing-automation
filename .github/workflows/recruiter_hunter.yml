name: AI Recruiter Hunter

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  recruiter-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify production files
        run: |
          test -f src/main.py
          test -f src/discovery/recruiters.py
          test -f src/discovery/jobs.py
          test -f src/matching/scorer.py
          test -f src/outreach/gmail.py
          test -f src/outreach/personalization.py
          test -f src/outreach/templates.py
          test -f src/storage/database.py
          test -f config/profile.json
          test -f assets/Snigdha-Gayathri-Resume.pdf

          python -m py_compile \
            src/main.py \
            src/discovery/recruiters.py \
            src/discovery/jobs.py \
            src/discovery/enrichment.py \
            src/matching/scorer.py \
            src/outreach/gmail.py \
            src/outreach/personalization.py \
            src/outreach/templates.py \
            src/storage/database.py

      - name: Run recruiter hunter
        env:
          APIFY_API_TOKEN: ${{ secrets.APIFY_API_TOKEN }}
          APIFY_RECRUITER_ACTOR: "harvestapi/linkedin-profile-search"

          MAX_APIFY_CALLS_PER_RUN: "1"
          MAX_EMAILS_PER_RUN: "5"

          STATE_PATH: "data/state.json"

          GMAIL_REFRESH_TOKEN: ${{ secrets.GMAIL_REFRESH_TOKEN }}
          GMAIL_CLIENT_ID: ${{ secrets.GMAIL_CLIENT_ID }}
          GMAIL_CLIENT_SECRET: ${{ secrets.GMAIL_CLIENT_SECRET }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}

          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GROQ_MODEL: "llama-3.3-70b-versatile"

        run: |
          python src/main.py

      - name: Commit updated state
        if: always()
        run: |
          if [ -f data/state.json ] || [ -f data/recruiter_search_state.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add \
              data/state.json \
              data/recruiter_search_state.json

            if git diff --cached --quiet; then
              echo "No state changes to commit."
            else
              git commit -m "chore: update recruiter outreach state"
              git push
            fi
          else
            echo "No state files found."
          fi
