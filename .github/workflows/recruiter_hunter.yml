name: AI Recruiter Hunter

on:
  workflow_dispatch:

  schedule:
    - cron: "0 * * * *"

permissions:
  contents: write

jobs:
  recruiter-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run zero-cost matching tests
        run: |
          python tests/test_matching.py

      - name: Confirm zero-cost test completion
        run: |
          echo "=============================================="
          echo "ZERO-COST TEST RUN COMPLETE"
          echo "=============================================="
          echo "Apify calls: 0"
          echo "Emails sent: 0"
          echo "Real recruiter discovery: DISABLED"
          echo "=============================================="
